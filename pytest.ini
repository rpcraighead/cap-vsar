[pytest]
# A bare `pytest` collects the repo suite and the ai_pilot service's own suite.
# NOT the whole tree:
#  - scripts/ holds manual harnesses whose filenames begin with test_
#    (scripts/test_base_radio_browser.py needs a live localhost URL and exits on
#    import), and a SystemExit during collection aborts the entire run.
#  - services/flightplanner/tests and services/board/tests are deliberately NOT
#    listed. services/exercise/app (a package), services/board/app (a package)
#    and services/flightplanner/app.py (a module) are all imported as "app", so
#    they cannot be collected in one process (O2-2).
#
# To run EVERYTHING, use scripts/run_tests.sh. It runs root tests, ai_pilot,
# flightplanner and board each in its own pytest process (set up with
# `pip install -r requirements-dev.txt`, Python 3.12).
testpaths = tests services/ai_pilot/tests

# Stock X-Plane 12 Cessna 172SP G1000. Flown: the frozen 20/20 campaign, KMYF landings, the KSEE-KMYF sortie
# (docs/C172_KSEE_KMYF_IFR_TRIAL.md). Moved from Python to this file 2026-10-15 with every value unchanged
# (services/ai_pilot/tests/test_profile_files.py asserts it). Schema: services/ai_pilot/profiles/README.md.
# Nothing here is operating guidance for a real aircraft.

[aircraft]
key = "C172SP"
acf_name = "Cessna_172SP_G1000.acf"
display_name = "X-Plane 12 stock Cessna 172SP G1000"
# true only after a sortie in THIS aircraft has been flown and scored with these values
tuning_validated = true

[speeds_kias]
# Sourced from the bundled X-Plane_C172_Pilot_Operating_Manual.pdf (describes the simulator aircraft,
# not a real aircraft's approved POH): rotate 55, Vx 62, Vy 74 KIAS; the other speeds are controller values
# flown on the 2026-10-11 KSEE-KMYF sortie (see [sources]).
vr = 55.0
vx = 62.0
vy = 74.0
climb_enroute = 85.0
cruise = 100.0
approach_initial = 100.0
approach_intermediate = 95.0
approach_clean = 80.0
ils_final = 73.0
final_approach = 65.0
missed = 74.0
va = 105.0
search = 90.0

[vfe]
# Same manual: flaps 10 deg 110 KIAS, 10-30 deg 85 KIAS; Va 105 KIAS at 2550 lb.
# [flap handle ratio, Vfe KIAS] per stage, smallest ratio first
stages = [[0.3333333333333333, 110.0], [1.0, 85.0]]

[flaps]
# The C172 takes off with flaps up.
takeoff_ratio = 0.0
retract_kias = 70.0
retract_agl_ft = 300.0
missed_ratio = 0.3333333333333333
ils_ratio = 0.3333333333333333
stage_names = ["10deg", "20deg", "30deg"]

# Landing flap stages, first to last. A stage is selected once the airplane is inside `inside_m` of the
# threshold AND no faster than `max_kias`; the last gate is full flaps (its distance and speed are ignored).
[[flaps.landing_gates]]
ratio = 0.3333333333333333
inside_m = 1852.0
max_kias = 85.0

[[flaps.landing_gates]]
ratio = 0.6666666666666666
inside_m = 926.0
max_kias = 75.0

[[flaps.landing_gates]]
ratio = 1.0
inside_m = 0.0
max_kias = 0.0

# --- tuning: controller constants and observer windows, not handbook figures ---
[landing]
# The 62-68 KIAS threshold window and 5-7 deg touchdown pitch are LandingObserver engineering criteria.
final_speed_add_kias = 5.0
threshold_kias = [62.0, 68.0]
touchdown_pitch_deg = [5.0, 7.0]
touchdown_max_groundspeed_kt = 78.0

[engine]
# the engine must exceed this RPM 5 s into the takeoff roll
min_roll_rpm = 1800.0

[throttle]
# Flown values (C172 trials 2026-10-10/11).
# taxi throttle = base + gain * (target - groundspeed), clamped to [0, max]
taxi_base = 0.16
taxi_speed_gain = 0.08
taxi_max = 0.28
cruise_base = 0.55
ils_base = 0.48
approach_base = 0.28

[envelope]
# the airborne speed band the bridge and observers accept
kias = [80.0, 140.0]

[prop]
# The stock C172 package is fixed pitch and has no lever.
constant_speed = false
# lever setting in level cruise, as a 0-1 ratio of the governing range; every other phase flies it full forward
cruise_ratio = 1.0

[sources]
"vr/vx/vy" = "bundled X-Plane_C172_Pilot_Operating_Manual.pdf: rotate 55, Vx 62, Vy 74 KIAS (docs/C172_KSEE_KMYF_IFR_TRIAL.md)"
"vfe/va" = "same manual: flaps 10 deg 110 KIAS, 10-30 deg 85 KIAS; Va 105 KIAS at 2550 lb"
"other speeds" = "controller values flown on the 2026-10-11 KSEE-KMYF sortie (services/ai_pilot/ksee_kmyf_mission.py, landing_trial.py)"
tuning = "C172 trials 2026-10-10/11; the 62-68 KIAS threshold window and 5-7 deg touchdown pitch are LandingObserver engineering criteria"

# -700 fpm
  [0.4, -700.0, 106.8],
  [0.5, -700.0, 114.4],
  [0.6, -700.0, 122.5],
  [0.7, -700.0, 130.5],
# -400 fpm
  [0.4, -400.0, 94.0],
  [0.5, -400.0, 109.2],
  [0.6, -400.0, 113.5],
  [0.7, -400.0, 122.5],
  [0.8, -400.0, 130.8],
# +0 fpm
  [0.5, 0.0, 92.2],
  [0.6, 0.0, 102.7],
  [0.7, 0.0, 114.0],
  [0.8, 0.0, 120.0],
  [0.9, 0.0, 129.6],
  [1.0, 0.0, 137.0],
# +400 fpm
  [0.7, 400.0, 98.9],

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} — N499CP Flight Planner</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0e1116; --panel:#161b22; --border:#2a2f3a; --text:#d7dce3;
      --dim:#8b939f; --accent:#4a86e8; --gold:#ffd700; --green:#28a745; --red:#bf0a30;
    }
    *{box-sizing:border-box}
    body{
      margin:0; background:var(--bg); color:var(--text);
      font-family:'IBM Plex Sans',system-ui,sans-serif; line-height:1.6;
    }
    header{
      position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:1rem;
      padding:0.7rem 1.2rem; background:var(--panel); border-bottom:1px solid var(--border);
    }
    header .brand{font-weight:700; letter-spacing:0.02em; white-space:nowrap}
    header .brand span{color:var(--accent)}
    header nav{display:flex; gap:0.4rem; margin-left:auto; flex-wrap:wrap}
    header a{
      text-decoration:none; color:var(--text); font-size:0.82rem;
      padding:0.35rem 0.7rem; border:1px solid var(--border); border-radius:6px;
      background:#1b212b; white-space:nowrap;
    }
    header a:hover{border-color:var(--accent); color:#fff}
    header a.dl{border-color:var(--green)}
    header a.dl:hover{background:#1f2a20}
    header a.app{border-color:var(--accent)}
    main{max-width:860px; margin:0 auto; padding:2rem 1.4rem 4rem}
    h1,h2,h3,h4{line-height:1.25; margin:1.8rem 0 0.7rem}
    h1{font-size:1.9rem; border-bottom:1px solid var(--border); padding-bottom:0.4rem}
    h2{font-size:1.4rem; border-bottom:1px solid var(--border); padding-bottom:0.3rem; margin-top:2.4rem}
    h3{font-size:1.12rem; color:#eef1f5}
    h4{font-size:0.98rem; color:var(--dim); text-transform:uppercase; letter-spacing:0.04em}
    a{color:var(--accent)}
    p,li{font-size:0.94rem}
    code{
      font-family:'JetBrains Mono',monospace; font-size:0.85em;
      background:#1b212b; padding:0.12em 0.4em; border-radius:4px; border:1px solid var(--border);
    }
    pre{
      background:#0a0d12; border:1px solid var(--border); border-radius:8px;
      padding:0.9rem 1.1rem; overflow-x:auto;
    }
    pre code{background:none; border:none; padding:0; font-size:0.85rem}
    blockquote{
      margin:1.2rem 0; padding:0.6rem 1rem; border-left:3px solid var(--gold);
      background:#191a12; color:#e8e2c4; border-radius:0 6px 6px 0;
    }
    blockquote p{margin:0.3rem 0}
    table{border-collapse:collapse; width:100%; margin:1rem 0; font-size:0.86rem; display:block; overflow-x:auto}
    th,td{border:1px solid var(--border); padding:0.45rem 0.7rem; text-align:left}
    th{background:#1b212b; font-weight:600}
    tr:nth-child(even) td{background:#12161d}
    hr{border:none; border-top:1px solid var(--border); margin:2rem 0}
    .warn{color:var(--gold)}
    footer{max-width:860px; margin:0 auto; padding:1rem 1.4rem 3rem; color:var(--dim); font-size:0.8rem}
  </style>
</head>
<body>
  <header>
    <div class="brand">N499CP <span>Flight Planner</span></div>
    <nav>
      <a href="/guide">User Guide</a>
      <a href="/guide/quickstart">Quick Start</a>
      <a class="dl" href="/docs/{{ download }}">⬇ Download (.md)</a>
      <a class="app" href="/">← Back to app</a>
    </nav>
  </header>
  <main>
    {{ body|safe }}
  </main>
  <footer>
    N499CP Flight Planner · SIM USE ONLY · brief with official sources before any real flight.
  </footer>
</body>
</html>

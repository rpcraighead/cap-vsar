<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAP V-SAR Debrief</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/static/style.css">
</head><body>

<header>
  <div class="brand"><b>CAP V-SAR</b> <span>Debrief</span></div>
  <div class="spacer"></div>
  <a class="navlink" href="/">Instructor console</a>
  <a class="navlink" href="/base">Mission Base</a>
  <a class="navlink" href="/radio">Base Radio</a>
  <a class="navlink nav-planner" href=":8090" target="_blank" title="N499CP Flight Planner">Flight Planner</a>
  <div id="clock" class="mono"></div>
</header>

<main>
  <aside>
    <section>
      <h2>Sortie</h2>
      <select id="sortieSel"></select>
      <div id="sortieInfo" class="box" style="margin-top:8px">select a sortie</div>
    </section>

    <section>
      <h2>Result</h2>
      <div id="result" class="box">—</div>
    </section>

    <section>
      <h2>Events</h2>
      <div id="events" class="box small">—</div>
    </section>
  </aside>

  <div style="flex:1;display:flex;flex-direction:column">
    <div id="map" style="flex:1"></div>
    <div class="scrub">
      <button id="play" class="primary">Play</button>
      <input id="slider" type="range" min="0" max="100" value="0">
      <span id="tlabel" class="mono">00:00</span>
      <select id="speed">
        <option value="1">1x</option>
        <option value="4" selected>4x</option>
        <option value="10">10x</option>
        <option value="30">30x</option>
      </select>
    </div>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/charts.js"></script>
<script src="/static/debrief.js"></script>
</body></html>

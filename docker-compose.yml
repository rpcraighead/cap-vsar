# CAP V-SAR - lab service stack
# Host: ms01 (192.0.2.151). Bring up with:  docker compose up -d
# Nothing here is reachable from the internet until the router forwards
# the ports listed in infra/ROUTER.md to this host.

services:

  # ---- Voice: CAP mission net (NOT ATC - ATC is PilotEdge) ----------------
  mumble:
    # O-5: pinned to what was already running and tested on ms01
    # (mumblevoip/mumble-server:latest resolved 2026-09-09, Mumble 1.5/24.04
    # base), not "latest" silently drifting under a live voice net.
    image: mumblevoip/mumble-server@sha256:b2d6b2d44b712232af90bdef37bfcbbf4e2f9819aee6bf8b7f46588b34973f6f
    container_name: capvsar-mumble
    restart: unless-stopped
    ports:
      - "64738:64738/tcp"
      - "64738:64738/udp"
    volumes:
      - ./mumble/data:/data
    # This image GENERATES its config from MUMBLE_CONFIG_* variables and
    # overwrites anything mounted at /data/mumble_server_config.ini - a
    # mounted config file is silently discarded. Set everything here.
    environment:
      TZ: ${TZ}
      MUMBLE_SUPERUSER_PASSWORD: ${MUMBLE_SUPERUSER_PASSWORD}
      MUMBLE_CONFIG_SERVERPASSWORD: ${MUMBLE_SERVER_PASSWORD}
      MUMBLE_CONFIG_REGISTERNAME: "CAP V-SAR"
      MUMBLE_CONFIG_USERS: "100"
      MUMBLE_CONFIG_BANDWIDTH: "72000"
      MUMBLE_CONFIG_OPUSTHRESHOLD: "0"
      MUMBLE_CONFIG_CHANNELNESTINGLIMIT: "10"
      MUMBLE_CONFIG_TEXTMESSAGELENGTH: "2000"
      MUMBLE_CONFIG_IMAGEMESSAGELENGTH: "0"
      MUMBLE_CONFIG_ALLOWHTML: "true"
      MUMBLE_CONFIG_CERTREQUIRED: "false"
      MUMBLE_CONFIG_SUGGESTPUSHTOTALK: "true"
      MUMBLE_CONFIG_REMEMBERCHANNEL: "true"
      MUMBLE_CONFIG_AUTOBANATTEMPTS: "10"
      MUMBLE_CONFIG_AUTOBANTIMEFRAME: "120"
      MUMBLE_CONFIG_AUTOBANTIME: "300"
      MUMBLE_CONFIG_WELCOMETEXT: >-
        <b>CAP V-SAR - Mission Voice Net</b><br/><br/>
        <b>EXERCISE TRAFFIC ONLY.</b> This is a training system. Nothing said
        here is a real distress communication, and nothing here is transmitted
        on any real radio.<br/><br/>
        ATC is on PilotEdge, not on this server. Keep mission traffic -
        bearings, beacon reports, base coordination - on the mission net
        channels.<br/><br/>
        Begin and end transmissions with EXERCISE, EXERCISE, EXERCISE.
    # The image ships neither ss nor netstat; bash is present, so open a real
    # TCP connection to the listening port instead.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/64738"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---- Exercise console: scenario control, live map, bearing log -----------
  exercise:
    build: ./services/exercise
    container_name: capvsar-exercise
    restart: unless-stopped
    # O-8: backend-only. Caddy is the sole participant-facing listener.
    expose:
      - "8700"
    volumes:
      - ./services/exercise/data:/data
      - ./services/exercise/radio-public:/radio-public:ro
    environment:
      TZ: ${TZ}
      CAPVSAR_DB: /data/exercise.db
      CAPVSAR_MUMBLE_HOST: mumble
      CAPVSAR_MUMBLE_PASSWORD: ${MUMBLE_SERVER_PASSWORD}
      CAPVSAR_RADIO_ACCESS_CODE: ${CAPVSAR_RADIO_ACCESS_CODE:-}
      CAPVSAR_RADIO_HTTPS_PORT: "443"
      # Role tokens. Unset means that role's endpoints accept anyone who can
      # reach the console, and the service says so loudly at startup - set all
      # three in .env before an exercise. The plugin key is also what unlocks
      # /api/plugin/scenario, the only route that serves beacon truth before
      # the instructor reveals; with no key set that route returns 503.
      CAPVSAR_TOKEN_INSTRUCTOR: ${CAPVSAR_TOKEN_INSTRUCTOR:-}
      CAPVSAR_TOKEN_BASE: ${CAPVSAR_TOKEN_BASE:-}
      CAPVSAR_TOKEN_PLUGIN: ${CAPVSAR_TOKEN_PLUGIN:-}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8700/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Single HTTPS front door for every participant browser and the plugin API.
  # Browser microphones require this trusted secure context. LAN/WireGuard only;
  # no router port forwarding. The historical service name is retained so the
  # deployed Caddy data volume and deploy tooling do not churn during cutover.
  radio-https:
    # O-5: pinned to what was already running and tested on ms01
    # (caddy:2 resolved 2026-09-09), not "latest" silently drifting under it.
    image: caddy@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d
    container_name: capvsar-radio-https
    restart: unless-stopped
    depends_on:
      - exercise
      - board
    ports:
      - "80:80"
      - "443:443"
      # O-9: the engineering listener. Separate port so the board can never be
      # reached by following the participant front door, and so it can be
      # firewalled or unpublished on its own.
      - "8443:8443"
    volumes:
      - ./services/exercise/Caddyfile:/etc/caddy/Caddyfile:ro
      - radio_caddy_data:/data
      - radio_caddy_config:/config
    # O-6: this container had no healthcheck at all, so a Caddy that stopped
    # proxying (TLS handshake failure, backend unreachable) looked identical
    # to a healthy one to `docker compose ps`.
    #
    # Two real mistakes fixed here after actually testing on ms01, not just
    # writing a command that looked plausible:
    #  - wget's cert-bypass flag is --no-check-certificate; -k is
    #    --convert-links, an unrelated option, that wget flat-out rejects.
    #  - https://localhost gets a TLS SNI of "localhost", which matches none
    #    of the Caddyfile's site names (ms01/ms01.local/192.0.2.151) and
    #    Caddy errors the handshake rather than falling back. Hitting the LAN
    #    IP directly from inside the container instead hangs on Docker's
    #    bridge networking (hairpin NAT back to the host's own published
    #    port). curl --resolve pins the connection to loopback while still
    #    presenting the SNI Caddy actually has a site block for.
    healthcheck:
      test: ["CMD", "curl", "-sk", "--resolve", "ms01.local:443:127.0.0.1",
             "-o", "/dev/null", "https://ms01.local/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---- Flight planner: pre-flight planning + CAP search patterns ----
  # Composited here (rather than its standalone Cloud Run deployment) so it
  # reaches the exercise console over the compose network as "exercise:8700"
  # instead of a LAN IP or a public URL a caller could redirect - see the
  # security note on sar_export_vsar() in app.py. It is reachable externally
  # only through Caddy at /planner/.
  flightplanner:
    build: ./services/flightplanner
    container_name: capvsar-flightplanner
    restart: unless-stopped
    depends_on:
      - exercise
    expose:
      - "8080"
    volumes:
      # L-12: mount the DIRECTORY, not the database file. SQLite writes its
      # journal and WAL next to the database; with a file mount those siblings
      # were written into the container's own layer, so a crash mid-write left
      # the journal on a discarded layer. The host file does not move -
      # ./services/flightplanner/data/aviation_data.db is the same path it
      # always was, now reached as /app/data/aviation_data.db.
      - ./services/flightplanner/data:/app/data
      - ./services/flightplanner/data/charts:/app/charts
    environment:
      TZ: ${TZ}
      PORT: "8080"
      DATABASE_PATH: /app/data/aviation_data.db
      VSAR_CONSOLE_URL: http://exercise:8700
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---- Agent coordination board: the Claude/Codex/Antigravity lanes -------
  # ENGINEERING surface, in a different trust domain from everything above.
  # It is reachable only through Caddy's 8443 listener, never the participant
  # front door on 443. It exists as its own container because the board used
  # to be four routes on the AI Pilot deck, which only runs on the workstation
  # next to X-Plane - so the board could not be opened from anywhere else.
  board:
    build: ./services/board
    container_name: capvsar-board
    restart: unless-stopped
    expose:
      - "8770"
    volumes:
      # A git working clone of THIS repository, all of its own. Never point
      # this at an agent's live working tree: the board commits and pushes,
      # and three agents leave work in progress in theirs.
      - ${CAPVSAR_BOARD_REPO:-./services/board/repo}:/repo
      - ${CAPVSAR_BOARD_SSH_KEY:-./services/board/secrets/id_ed25519}:/home/capvsar/.ssh/id_ed25519:ro
      - ${CAPVSAR_BOARD_KNOWN_HOSTS:-./services/board/secrets/known_hosts}:/home/capvsar/.ssh/known_hosts:ro
    environment:
      TZ: ${TZ}
      # Unset disables every write and the service says so at startup and in
      # /api/health. It does not fall open.
      CAPVSAR_BOARD_TOKEN: ${CAPVSAR_BOARD_TOKEN:-}
      CAPVSAR_BOARD_ORIGINS: ${CAPVSAR_BOARD_ORIGINS:-}
      CAPVSAR_BOARD_REPO: /repo
      CAPVSAR_BOARD_FILE: docs/BOARD.md
      CAPVSAR_BOARD_GIT_SYNC: "1"
      # StrictHostKeyChecking stays on: this key can write to the monorepo.
      GIT_SSH_COMMAND: >-
        ssh -i /home/capvsar/.ssh/id_ed25519
        -o UserKnownHostsFile=/home/capvsar/.ssh/known_hosts
        -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8770/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# WireGuard intentionally NOT run here.
# The GL-MT6000 already terminates WireGuard on its WAN (wgserver, UDP 51820)
# with live peers including a GCP site-to-site tunnel. Running a second server
# on this host and forwarding 51820 to it would have broken all of them.
# CAP V-SAR participants get peers on the router instead - see infra/ROUTER.md.

volumes:
  radio_caddy_data:
  radio_caddy_config:

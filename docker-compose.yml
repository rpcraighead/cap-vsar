# CAP V-SAR - lab service stack
# Host: ms01 (192.0.2.151). Bring up with:  docker compose up -d
# Nothing here is reachable from the internet until the router forwards
# the ports listed in infra/ROUTER.md to this host.

services:

  # ---- Voice: CAP mission net (NOT ATC - ATC is PilotEdge) ----------------
  mumble:
    image: mumblevoip/mumble-server:latest
    container_name: capvsar-mumble
    restart: unless-stopped
    ports:
      - "64738:64738/tcp"
      - "64738:64738/udp"
    volumes:
      - ./mumble/data:/data
    # This image GENERATES its config from MUMBLE_CONFIG_* variables and
    # overwrites anything mounted at /data/mumble_server_config.ini - a
    # mounted config file is silently discarded. Set everything here.
    environment:
      TZ: ${TZ}
      MUMBLE_SUPERUSER_PASSWORD: ${MUMBLE_SUPERUSER_PASSWORD}
      MUMBLE_CONFIG_SERVERPASSWORD: ${MUMBLE_SERVER_PASSWORD}
      MUMBLE_CONFIG_REGISTERNAME: "CAP V-SAR"
      MUMBLE_CONFIG_USERS: "100"
      MUMBLE_CONFIG_BANDWIDTH: "72000"
      MUMBLE_CONFIG_OPUSTHRESHOLD: "0"
      MUMBLE_CONFIG_CHANNELNESTINGLIMIT: "10"
      MUMBLE_CONFIG_TEXTMESSAGELENGTH: "2000"
      MUMBLE_CONFIG_IMAGEMESSAGELENGTH: "0"
      MUMBLE_CONFIG_ALLOWHTML: "true"
      MUMBLE_CONFIG_CERTREQUIRED: "false"
      MUMBLE_CONFIG_SUGGESTPUSHTOTALK: "true"
      MUMBLE_CONFIG_REMEMBERCHANNEL: "true"
      MUMBLE_CONFIG_AUTOBANATTEMPTS: "10"
      MUMBLE_CONFIG_AUTOBANTIMEFRAME: "120"
      MUMBLE_CONFIG_AUTOBANTIME: "300"
      MUMBLE_CONFIG_WELCOMETEXT: >-
        <b>CAP V-SAR - Mission Voice Net</b><br/><br/>
        <b>EXERCISE TRAFFIC ONLY.</b> This is a training system. Nothing said
        here is a real distress communication, and nothing here is transmitted
        on any real radio.<br/><br/>
        ATC is on PilotEdge, not on this server. Keep mission traffic -
        bearings, beacon reports, base coordination - on the mission net
        channels.<br/><br/>
        Begin and end transmissions with EXERCISE, EXERCISE, EXERCISE.
    # The image ships neither ss nor netstat; bash is present, so open a real
    # TCP connection to the listening port instead.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/64738"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---- Exercise console: scenario control, live map, bearing log -----------
  exercise:
    build: ./services/exercise
    container_name: capvsar-exercise
    restart: unless-stopped
    # LAN and WireGuard only - deliberately not published to the internet.
    ports:
      - "8700:8700"
    volumes:
      - ./services/exercise/data:/data
    environment:
      TZ: ${TZ}
      CAPVSAR_DB: /data/exercise.db
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8700/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# WireGuard intentionally NOT run here.
# The GL-MT6000 already terminates WireGuard on its WAN (wgserver, UDP 51820)
# with live peers including a GCP site-to-site tunnel. Running a second server
# on this host and forwarding 51820 to it would have broken all of them.
# CAP V-SAR participants get peers on the router instead - see infra/ROUTER.md.
